[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "astrobatch"
version = "2.0.0"
description = "A guided desktop workflow for astrophotography batch processing"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.7,<7",
  "numpy",
  "astropy",
  "pillow",
  "opencv-python-headless",
  "photutils",
  "scipy",
  "matplotlib",
  "psutil",
  "colour-demosaicing",
  "scikit-image",
  "numba",
  "bottleneck",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "pyinstaller>=6.0"]

[project.scripts]
astrobatch = "astrobatch.__main__:main"

[tool.setuptools.packages.find]
include = ["astrobatch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
